<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Freela da Moda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* Estilos específicos para a tela de Login */
        .auth-container {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            width: 100%;
            max-width: 480px;
            padding: 44px 36px;
            border: 1px solid var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 1.85rem;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Seletor de Perfil (Freelancer / Empresa) */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--primary-light);
            padding: 4px;
            border-radius: var(--radius-sm);
            gap: 4px;
            margin-bottom: 24px;
        }

        .role-option {
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: calc(var(--radius-sm) - 2px);
            color: var(--text-dark);
            transition: all 0.2s ease;
            user-select: none;
        }

        .role-option.active {
            background: #ffffff;
            color: var(--primary-bright);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 42px 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            background: #fafafa;
            outline: none;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-bright);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(112, 0, 194, 0.1);
        }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 14px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 0.88rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-dark);
        }

        .forgot-link {
            color: var(--primary-bright);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .auth-message {
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            margin-bottom: 18px;
            display: none;
        }

        .auth-message.error {
            display: block;
            background: #ffebe9;
            color: #d93025;
            border: 1px solid #ffc1bc;
        }

        .auth-message.success {
            display: block;
            background: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }

        .auth-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary-bright);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- HEADER SIMPLIFICADO -->
    <header class="header container">
        <a href="home.html" class="logo-area">
            <img src="img/logo.svg" alt="Logo Freela da Moda" class="logo-img" />
            <div class="logo-text">
                <span>FREELA</span>
                <span>DA MODA</span>
            </div>
        </a>

        <div class="header-actions">
            <a href="home.html" class="btn btn-link"><i class="bi bi-arrow-left"></i> Voltar ao início</a>
        </div>
    </header>

    <!-- FORMULÁRIO DE LOGIN -->
    <main class="auth-container">
        <div class="auth-card">
            
            <div class="auth-header">
                <h1>Acesse sua conta</h1>
                <p>Boas-vindas de volta! Entre com seus dados.</p>
            </div>

            <!-- Seleção de Tipo de Conta -->
            <div class="role-selector">
                <div class="role-option active" id="tab-freelancer" data-role="freelancers">
                    <i class="bi bi-person"></i> Sou Freelancer
                </div>
                <div class="role-option" id="tab-empresa" data-role="empresas">
                    <i class="bi bi-building"></i> Sou Empresa
                </div>
            </div>

            <!-- Mensagens de Alerta/Erro -->
            <div id="auth-alert" class="auth-message"></div>

            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password" />
                        <i class="bi bi-eye toggle-password" id="toggleSenha"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="lembrar-me" />
                        Lembrar-me
                    </label>
                    <a href="#" class="forgot-link" id="link-esqueci-senha">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn btn-purple w-full" id="btn-entrar" style="padding: 14px;">
                    Entrar na plataforma <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                Não tem uma conta? 
                <a href="cadastro-freelancer.html" id="link-cadastro">Cadastre-se como Freelancer</a>
            </div>

        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
