<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Freela da Moda - Pesquisar Ofertas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="logo">

                <img src="img/logo.svg" alt="Logo">

                <div class="logo-text">
                    <span>FREELA</span>
                    <span>DA MODA</span>
                </div>

            </div>

            <nav class="menu">

                <a href="#" class="menu-item">
                    <i class="bi bi-house"></i>
                    Início
                </a>

                <a href="#" class="menu-item active">
                    <i class="bi bi-search"></i>
                    Pesquisar ofertas
                </a>

                <a href="#" class="menu-item">
                    <i class="bi bi-journal-text"></i>
                    Minhas candidaturas
                </a>

                <a href="#" class="menu-item">
                    <i class="bi bi-chat-left"></i>
                    Conversas
                </a>

                <a href="#" class="menu-item">
                    <i class="bi bi-star"></i>
                    Avaliações
                </a>

                <a href="#" class="menu-item">
                    <i class="bi bi-person"></i>
                    Meu perfil
                </a>

                <a href="#" class="menu-item">
                    <i class="bi bi-credit-card"></i>Assinatura</a>

                <a href="#" class="menu-item">
                    <i class="bi bi-question-circle"></i>Ajuda</a>

                <a href="#" class="menu-item">
                    <i class="bi bi-box-arrow-right"></i>
                    Sair
                </a>

            </nav>

        </aside>

        <main class="content">

            <header class="topbar">

                <div></div>

                <div class="topbar-actions">

                    <button class="icon-btn">
                        <i class="bi bi-bell"></i>
                    </button>

                    <button class="icon-btn">
                        <i class="bi bi-envelope"></i>
                    </button>

                    <img
                        src="img/avatar.jpg"
                        alt="Avatar"
                        class="avatar">

                </div>

            </header>

            <section class="search-area">

                <h1>Buscar ofertas</h1>

                <div class="search-row">

                    <div class="search-box">

                        <i class="bi bi-search"></i>

                        <input
                            type="text"
                            placeholder="Ex: Costureira, Modelista, etc.">

                    </div>

                    <button class="filter-btn">
                        <i class="bi bi-sliders"></i>
                        Filtros
                    </button>

                </div>

                <div class="filters">
                    <select>
                        <option>Categoria</option>
                    </select>

                    <select>
                        <option>Localização</option>
                    </select>

                    <select>
                        <option>Disponibilidade</option>
                    </select>

                    <select>
                        <option>Mais filtros</option>
                    </select>
                </div>
            </section>
            
            <section class="jobs-list">
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
