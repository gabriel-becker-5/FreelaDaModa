<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mural de Vagas | Freela da Moda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* Estilos específicos do Mural de Vagas */
        .mural-header {
            background: var(--card-dark-gradient);
            border-radius: var(--radius-lg);
            padding: 40px;
            color: var(--text-light);
            margin: 20px auto 30px;
            box-shadow: var(--shadow-card);
        }

        .mural-header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .mural-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-bottom: 24px;
        }

        .filter-bar {
            display: grid;
            grid-template-columns: 2fr 1.2fr auto;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: var(--radius-md);
            backdrop-filter: blur(8px);
        }

        .filter-bar input,
        .filter-bar select {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #ffffff;
            color: var(--text-dark);
            font-size: 0.95rem;
            outline: none;
        }

        .jobs-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 60px;
        }

        .job-card {
            background: #ffffff;
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            border-color: var(--primary-bright);
        }

        .job-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .job-title {
            font-size: 1.25rem;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .company-name {
            color: var(--primary-bright);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .job-badge {
            background: var(--primary-light);
            color: var(--primary-bright);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .job-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 0.88rem;
            color: var(--text-dark);
            align-items: center;
            justify-content: space-between;
        }

        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
        }

        .meta-item strong {
            color: var(--text-dark);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--primary-bright);
            margin-bottom: 12px;
            display: block;
        }

        @media (max-width: 768px) {
            .filter-bar {
                grid-template-columns: 1fr;
            }
            .job-card-header {
                flex-direction: column;
                gap: 8px;
            }
            .job-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="header container">
        <a href="home.html" class="logo-area">
            <img src="img/logo.svg" alt="Logo Freela da Moda" class="logo-img" />
            <div class="logo-text">
                <span>FREELA</span>
                <span>DA MODA</span>
            </div>
        </a>

        <nav class="nav-menu">
            <a href="home.html">Início</a>
            <a href="vagas.html" style="color: var(--primary-bright); font-weight: 700;">Mural de Vagas</a>
            <a href="dashboard-freelancer.html" id="link-dashboard">Meu Painel</a>
        </nav>

        <div class="header-actions">
            <span id="user-greeting" style="font-size: 0.9rem; font-weight: 600; color: var(--primary-bright);"></span>
            <a href="login.html" class="btn btn-outline-purple" id="btn-auth">Entrar</a>
        </div>
    </header>

    <main class="container">

        <!-- CABEÇALHO COM FILTROS -->
        <section class="mural-header">
            <span class="badge"><i class="bi bi-briefcase"></i> OPORTUNIDADES ABERTAS</span>
            <h1>Mural de Vagas para Confecção</h1>
            <p>Encontre trabalhos sob demanda ou contratos fixos com confecções de todo o Brasil.</p>

            <div class="filter-bar">
                <input type="text" id="filtro-busca" placeholder="Buscar por título, descrição ou confecção..." />
                <select id="filtro-especialidade">
                    <option value="">Todas as especialidades</option>
                    <option value="Costura reta">Costura reta</option>
                    <option value="Overloque">Overloque</option>
                    <option value="Modelagem">Modelagem</option>
                    <option value="Peça piloto">Peça piloto</option>
                    <option value="Acabamento">Acabamento</option>
                    <option value="Bordado">Bordado</option>
                    <option value="Estamparia">Estamparia</option>
                </select>
                <button type="button" class="btn btn-purple-bright" id="btn-limpar-filtros">
                    <i class="bi bi-x-circle"></i> Limpar
                </button>
            </div>
        </section>

        <!-- LISTAGEM DE CARDS DE VAGAS -->
        <section class="jobs-layout" id="lista-vagas">
            <!-- Vagas renderizadas dinamicamente pelo vagas.js -->
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container" style="text-align: center;">
            <p>Freela da Moda © 2026 — Conectando talento à moda da sua região</p>
        </div>
    </footer>

    <script src="vagas.js"></script>
</body>
</html>
