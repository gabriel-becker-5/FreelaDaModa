<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro Empresa</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: { DEFAULT: '#820ad1', '600': '#6d08b5', '700': '#4f0087', '100': '#f0e2ff' },
              surface: { DEFAULT: '#ffffff', alt: '#f3efff' }
            },
            fontFamily: { sans: ['Plus Jakarta Sans', 'Arial', 'sans-serif'] },
            borderRadius: { DEFAULT: '12px' }
          }
        }
      }
    </script>
  </head>
  <body>
    <main class="main">
      <div class="page-container-md">
        <div class="header">
          <h2>Cadastro Empresa</h2>
          <div class="header-actions">
            <button
              class="theme-toggle"
              type="button"
              aria-label="Alternar tema claro e escuro"
            ><i class="bi bi-moon-stars" aria-hidden="true"></i></button>
            <a href="01-homepage.html" class="btn">Voltar</a>
          </div>
        </div>
        <form class="card">
          <div class="alert alert-success" role="alert" aria-live="polite">
            Área para feedback de cadastro da empresa.
          </div>
          <div class="section-title">Responsável legal</div>
          <div class="form-row">
            <div class="form-group">
              <label for="resp-nome">Nome completo do responsável legal</label
              ><input id="resp-nome" class="input" required />
            </div>
            <div class="form-group">
              <label for="resp-cpf">CPF do responsável</label
              ><input
                id="resp-cpf"
                class="input"
                placeholder="000.000.000-00"
                required
              />
            </div>
          </div>
          <div class="section-title">Dados da empresa</div>
          <div class="form-row">
            <div class="form-group">
              <label for="razao">Razão Social</label
              ><input id="razao" class="input" required />
            </div>
            <div class="form-group">
              <label for="fantasia">Nome Fantasia</label
              ><input id="fantasia" class="input" required />
            </div>
          </div>
          <div class="form-group">
            <label for="descricao-empresa">Descrição do perfil</label
            ><textarea id="descricao-empresa" class="input" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="cnpj">CNPJ</label
              >              <input
                id="cnpj"
                class="input input-error"
                placeholder="00.000.000/0000-00"
                value="00.000.000/0000"
                required
              />
              <span class="field-message field-message-error"
                ><i class="bi bi-exclamation-circle-fill"></i> CNPJ inválido. Verifique o formato.</span
            </div>
            <div class="form-group">
              <label for="email-empresa">E-mail</label
              ><input id="email-empresa" type="email" class="input" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="telefone-empresa">Telefone/Whatsapp</label
              ><input
                id="telefone-empresa"
                type="tel"
                class="input"
                placeholder="(00) 00000-0000"
                required
              />
            </div>
            <div class="form-group">
              <label for="ramo">Ramo de atuação</label
              ><input id="ramo" class="input" required />
            </div>
          </div>
          <div class="section-title">Endereço comercial</div>
          <div class="form-row">
            <div class="form-group">
              <label for="cep-empresa">Comercial - CEP</label
              ><input id="cep-empresa" class="input" required />
            </div>
            <div class="form-group">
              <label for="endereco-empresa">Comercial - Endereço</label
              ><input id="endereco-empresa" class="input" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="numero-empresa">Comercial - Número</label
              ><input id="numero-empresa" class="input" required />
            </div>
            <div class="form-group">
              <label for="bairro-empresa">Comercial - Bairro</label
              ><input id="bairro-empresa" class="input" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="complemento-empresa">Comercial - Complemento</label
              ><input id="complemento-empresa" class="input" />
            </div>
            <div class="form-group">
              <label for="cidade-empresa">Comercial - Cidade</label
              ><input id="cidade-empresa" class="input" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="estado-empresa">Comercial - Estado</label
              ><input id="estado-empresa" class="input" required />
            </div>
            <div class="form-group">
              <label for="senha-empresa">Senha</label
              ><input
                id="senha-empresa"
                type="password"
                class="input"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label for="status-empresa">Status</label
            ><select id="status-empresa" class="input">
              <option>Pendente</option>
              <option>Ativo</option>
              <option>Inativo</option></select
            ><span class="field-message"
              >Status exibido para contexto administrativo.</span
            >
          </div>
          <div class="form-actions">
            <a href="01-homepage.html" class="btn">Voltar</a
            ><button class="btn btn-primary" type="submit">Cadastrar</button>
          </div>
        </form>
      </div>
    </main>
    <script src="../js/06-cadastro-empresa.js"></script>
  </body>
</html>
