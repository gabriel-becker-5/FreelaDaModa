<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Freela da Moda</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: { DEFAULT: '#820ad1', '600': '#6d08b5', '700': '#4f0087', '100': '#f0e2ff' },
              surface: { DEFAULT: '#ffffff', alt: '#f3efff' }
            },
            fontFamily: { sans: ['Plus Jakarta Sans', 'Arial', 'sans-serif'] },
            borderRadius: { DEFAULT: '12px' }
          }
        }
      }
    </script>
  </head>
  <body>
    <main class="main">
      <div class="page-container-sm">
        <div class="stack" style="align-items: center; text-align: center; margin-bottom: 32px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-primary);">
            <img
              src="../assets/logo.svg"
              alt="Freela da Moda"
              class="brand-logo"
              style="width: 64px; height: 64px; border-radius: 14px; border: 2px solid var(--surface-alt);"
            />
            <span style="font-size: 28px; font-weight: 800; letter-spacing: 2px; line-height: 1.1; display: flex; flex-direction: column; color: var(--text-primary);">FREELA<span style="display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.34em; opacity: 0.65; color: var(--text-secondary);">DA MODA</span></span>
          </div>
          <p style="color: var(--text-secondary); font-size: 15px; margin-top: 4px;">Entre na sua conta para continuar</p>
        </div>
        <section class="card stack-sm">
          <div class="cluster-between">
            <h2>Entrar</h2>
            <button
              class="theme-toggle"
              type="button"
              aria-label="Alternar tema claro e escuro"
            ><i class="bi bi-moon-stars" aria-hidden="true"></i></button>
          </div>
          <div class="alert alert-error" role="alert" aria-live="polite">
            Área para exibir erro de login inválido.
          </div>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              id="login-email"
              class="input"
              type="email"
              autocomplete="email"
              placeholder="seu@email.com"
              required
            />
            <span class="field-message">Informe o email cadastrado.</span>
          </div>
          <div class="form-group">
            <label for="login-senha">Senha</label>
            <input
              id="login-senha"
              class="input"
              type="password"
              autocomplete="current-password"
              placeholder="Sua senha"
              required
            />
            <span class="field-message">Mínimo 8 caracteres.</span>
          </div>
          <div class="cluster-between" style="font-size: 13px;">
            <a href="#recuperar-senha" style="color: var(--color-primary);">Esqueci minha senha</a>
          </div>
          <button class="btn btn-primary w-full">Entrar</button>
          <div style="display: flex; align-items: center; gap: 12px; color: var(--text-secondary); font-size: 12px;">
            <span style="flex: 1; height: 1px; background: var(--border);"></span>
            <span>ou</span>
            <span style="flex: 1; height: 1px; background: var(--border);"></span>
          </div>
          <button class="btn w-full" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="bi bi-google"></i> Entrar com Google
          </button>
          <p style="text-align: center; font-size: 13px; color: var(--text-secondary); margin: 0;">
            Não tem conta? <a href="05-cadastro-freelancer.html" style="color: var(--color-primary); font-weight: 600;">Cadastre-se como Freelancer</a>
            ou <a href="06-cadastro-empresa.html" style="color: var(--color-primary); font-weight: 600;">Empresa</a>
          </p>
          <div id="recuperar-senha" class="empty-state">
            Recuperação de senha: informe seu email para receber instruções.
          </div>
        </section>
      </div>
    </main>
    <script src="../js/02-login.js"></script>
  </body>
</html>
